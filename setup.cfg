[metadata]
name = imagine-generator-proxy
version = 0.1.0
description = A small proxy server to generate images via NovelAI.
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
author_email = you@example.com
license = MIT

[options]
packages = find:
install_requires =
    PyYAML>=6.0
    aiohttp>=3.8
    novelai>=0.34.1
    Pillow>=10
    openai>=1.0
python_requires = >=3.9

[options.package_data]
imagine_generator_proxy =
    rule_data.json

[options.entry_points]
console_scripts =
    imagine-generator-proxy = imagine_generator_proxy.__main__:main
