[project]
name = "imagine-generator-proxy"
version = "0.1.0"
description = "A small proxy server to generate images via NovelAI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [ { name = "Your Name", email = "you@example.com" } ]
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.8",
    "novelai-api>=0.34.1",
    "Pillow>=10",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.mypy]
# The package still runs on 3.9+, but current mypy cannot emulate 3.9
# semantics — 3.10 is the oldest it can check against.
python_version = "3.10"
ignore_missing_imports = true
files = ["src/imagine_generator_proxy"]
