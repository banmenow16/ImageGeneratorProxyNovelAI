[project]
name = "imagine-generator-proxy"
version = "0.1.0"
description = "A small proxy server to generate images via NovelAI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [ { name = "Your Name", email = "you@example.com" } ]
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.8",
    "novelai>=0.34.1",
    "Pillow>=10",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
